spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql//localhost:3306/payment_db?createDatabaseIfNotExists=true
    username: root
    password: "$1715Akshay"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show:sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.spring.framework.kafka.support.serializer.JsonSerializer

server:
  port: 8083


# Razorpay Configuration
razorpay:
  key-id: rzp_xxxxxx
  key-secret:
  webhook-secret:

management:
  endpoints:
    web:
      exposure:
        include: health,info