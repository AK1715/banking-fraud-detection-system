<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            width: min(360px, 85vw);
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 30px #0001;
        }
        h2 { margin-top: 0; color: #173b70; }
        label { display: block; margin: 16px 0 6px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3df;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #174ea6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        #message { margin-top: 16px; white-space: pre-wrap; }
        .error { color: #b42318; }
        .success { color: #067647; }
    </style>
</head>
<body>
<div class="card">
    <h2>Bank Payment</h2>

    <form id="paymentForm">
        <label for="accountNumber">Account Number</label>
        <input id="accountNumber" inputmode="numeric"
               autocomplete="off" required
               placeholder="Enter account number">

        <label for="amount">Amount ($)</label>
        <input id="amount" type="number" min="1" max="100000"
               step="0.01" required placeholder="Enter amount">

        <button id="payButton" type="submit">Pay Now</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
</div>

<script>
    const form = document.getElementById("paymentForm");
    const button = document.getElementById("payButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
        message.textContent = text;
        message.className = type;
        if (type === "error") alert(text);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const accountNumber =
            document.getElementById("accountNumber").value.trim();
        const amount = Number(
            document.getElementById("amount").value
        );

        if (!/^\d{8,20}$/.test(accountNumber)) {
            showMessage("Please enter a valid account number.");
            return;
        }

        if (!Number.isFinite(amount) || amount < 1 ||
            amount > 100000 || Math.round(amount * 100) !== amount * 100) {
            showMessage("Enter an amount from ₹1 to ₹1,00,000 with at most 2 decimal places.");
            return;
        }

        button.disabled = true;
        message.textContent = "Creating secure payment order...";
        message.className = "";

        try {
            const response = await fetch("/api/v1/payments/orders", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ accountNumber, amount })
            });

            const order = await response.json();

            if (!response.ok) {
                throw new Error(order.message || "Could not create payment order.");
            }

            const checkout = new Razorpay({
                key: order.keyId,
                amount: order.amount,
                currency: order.currency,
                name: "Banking Application",
                description: "Account payment",
                order_id: order.orderId,

                handler: async function (result) {
                    try {
                        message.textContent = "Verifying payment...";
                        const verifyResponse = await fetch(
                            "/api/v1/payments/verify",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    razorpayOrderId: result.razorpay_order_id,
                                    razorpayPaymentId: result.razorpay_payment_id,
                                    razorpaySignature: result.razorpay_signature
                                })
                            }
                        );

                        const verification = await verifyResponse.json();

                        if (!verifyResponse.ok) {
                            throw new Error(
                                verification.message ||
                                "Payment verification failed."
                            );
                        }

                        showMessage(
                            "Payment verified. Reference: " +
                            result.razorpay_payment_id +
                            "\nAccount credit will be confirmed by the server.",
                            "success"
                        );
                    } catch (error) {
                        showMessage(error.message || "Could not verify payment.");
                    } finally {
                        button.disabled = false;
                    }
                },

                modal: {
                    ondismiss: function () {
                        message.textContent =
                            "Checkout closed. Check payment status before retrying.";
                        button.disabled = false;
                    }
                },

                theme: { color: "#174ea6" }
            });

            checkout.on("payment.failed", function (result) {
                const error = result.error || {};
                showMessage(
                    "Payment failed: " +
                    (error.description || error.reason || "Please check payment status.")
                );
                button.disabled = false;
            });

            checkout.open();

        } catch (error) {
            showMessage(error.message || "Unable to start payment.");
            button.disabled = false;
        }
    });
</script>
</body>
</html>
